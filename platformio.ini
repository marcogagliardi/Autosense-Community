; =============================================================================
; AutoSense Community - plugin test harness  (AutoSense 2.x, plugin SDK v1)
; =============================================================================
; 1. Put your plugin in src/   (python sdk/tools/new_plugin.py auto "My sensor"
;    or copy an example:  examples/P002_DHT/P002.cpp -> src/)
; 2. Add your sensor library to lib_deps below.
; 3. Connect the board, pick the environment (esp32dev / nodemcuv2) and run
;    PlatformIO "Upload and Monitor".  Type `help` in the Serial Monitor.
; =============================================================================

[platformio]
default_envs = esp32dev

[common]
monitor_speed = 115200
build_flags =
    -Isdk/include
    ; -DHARNESS_INTERVAL_MS=2000      ; reading interval
    ; -DHARNESS_I2C_SDA=21            ; I2C pins (defaults: ESP32 21/22, ESP8266 4/5)
    ; -DHARNESS_I2C_SCL=22
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.1        ; used by the harness (MQTT preview)

    ; --- add your sensor library here; the examples need: ---
    ; adafruit/DHT sensor library @ ^1.4.6            ; examples/P002_DHT
    ; adafruit/Adafruit Unified Sensor @ ^1.1.14      ; examples/P002_DHT, examples/P010_BME688
    ; adafruit/Adafruit BME680 Library @ ^2.0.6       ; examples/P010_BME688
    ;                                                 ; examples/P006_pH needs no library

    ; --- libraries the AutoSense firmware already ships (use these versions) ---
    ; paulstoffregen/OneWire @ ^2.3.8
    ; milesburton/DallasTemperature @ ^4.0.4
    ; dfrobot/DFRobot_EOxygenSensor @ ^1.0.0
    ; phoenix1747/MQ135 @ ^1.1.1
    ; miguel5612/MQUnifiedsensor @ ^3.0.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_filters = send_on_enter
monitor_echo = yes
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = ${common.monitor_speed}
monitor_filters = send_on_enter
monitor_echo = yes
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
