; =============================================================================
; AutoSense Community — Plugin Test Harness
; =============================================================================
; This project allows you to develop, compile, flash, and test your new
; AutoSense plugins on real hardware using PlatformIO before submitting them.
;
; How to use:
; 1. Copy your plugin (e.g. from TEMPLATE/ or examples/) into the src/ folder.
; 2. Add any required sensor libraries under `lib_deps` below.
; 3. Connect your board (ESP32 or ESP8266) via USB.
; 4. Click PlatformIO: "Upload and Monitor" to test in real-time.
; =============================================================================

[platformio]
default_envs = esp32dev
src_dir = src

[common]
monitor_speed = 115200
upload_speed = 115200
build_flags = 
    -Iinclude
lib_deps =
    bblanchon/ArduinoJson @ ^7.4.1

    ; --- Uncomment libraries as needed for your sensor ---
    ; adafruit/DHT sensor library @ ^1.4.6
    ; adafruit/Adafruit BME680 Library @ ^2.0.6
    ; adafruit/Adafruit Unified Sensor @ ^1.1.14
    ; adafruit/Adafruit SSD1306 @ ^2.5.13
    ; paulstoffregen/OneWire @ ^2.3.8
    ; milesburton/DallasTemperature @ ^4.0.4

; --- ESP32 Environment ---
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

; --- ESP8266 / NodeMCU Environment ---
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}
